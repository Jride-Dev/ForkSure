[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forksure"
version = "0.2.0"
description = "GitHub repository provenance, fork audit, imposter repo, and license drift scanner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jay Curtis" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forksure = "forksure.cli:app"

[project.urls]
Homepage = "https://forksure.jri-techyes.top/"
Repository = "https://github.com/Jride-Dev/ForkSure"
Issues = "https://github.com/Jride-Dev/ForkSure/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
