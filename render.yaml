services:
  - type: web
    name: forksure-api
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn forksure.web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FORKSURE_HOSTED
        value: "true"
      - key: FORKSURE_ENABLE_SIMILARITY
        value: "true"
      - key: FORKSURE_ENABLE_SECURITY
        value: "true"
      - key: FORKSURE_PROXY_TOKEN
        sync: false
      - key: FORKSURE_PUBLIC_URL
        value: "https://forksure.jri-techyes.top"
      - key: FORKSURE_GITHUB_APP_CLIENT_ID
        sync: false
      - key: FORKSURE_GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: FORKSURE_GITHUB_APP_SLUG
        sync: false
